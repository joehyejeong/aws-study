<div class="shell"><header><button id="menu" aria-expanded="false" aria-controls="sidebar" aria-label="학습 메뉴 열기">☰</button><span>개념 학습실 <i>/</i> <strong id="crumb">학습 지도</strong></span><small>LOCAL EDITION</small></header><main id="main" tabindex="-1"></main><footer><b>JIKKO DEPLOYMENT CLASS</b><span>2026.11.24 · 로컬 학습 교재 · 실제 AWS 실행 없음</span></footer></div><noscript>JavaScript를 켜면 개념 수업과 복습 퀴즈를 사용할 수 있어요.</noscript><script>const LESSONS = [{"title": "배포의 큰 그림", "subtitle": "요청이 흐르는 길과 코드를 운반하는 길을 구분해요.", "analogy": "서비스를 식당이라고 생각해 볼까요? GitHub Actions는 조리법을 검수하고 식사 키트를 만드는 공장, Lightsail은 실제 손님을 받는 매장이에요. 배달 트럭이 계속 매장 안에서 음식을 만드는 것은 아니랍니다.", "limit": "컨테이너는 독립된 물리 서버가 아니에요. 같은 서버의 CPU·메모리·커널을 공유하므로 한 서버가 고장 나면 그 안의 API와 Redis도 함께 영향을 받아요.", "sections": [["런타임: 사용자의 요청이 처리되는 시간", "React에서 fetch를 호출한 뒤의 여정을 떠올려 보세요. 브라우저가 API 도메인으로 HTTPS 요청을 보내면 Nginx가 받아 Express 컨테이너로 전달해요. Express는 필요한 데이터를 PostgreSQL에서 읽고 Redis나 외부 인증·결제 서비스를 이용한 뒤 응답해요. 프론트 배포 환경을 바꾸지 않아도 API 주소와 쿠키 조건은 맞아야 해요."], ["배포: 실행할 프로그램을 바꾸는 시간", "GitHub Actions가 소스를 검사하고 Docker 이미지를 만들어요. 압축한 이미지를 SSH로 전달하면 서버는 docker load로 등록하고 그 이미지로 컨테이너를 실행해요. Next의 빌드 결과물을 배포하는 과정과 비슷하지만 여기서는 Node 실행 환경까지 이미지에 포함해요. CI가 끝난 뒤에도 서버는 독립적으로 요청을 처리해요."], ["학습 목표와 현재 파일을 분리해서 읽어요", "이번 목표는 API 서버 1대 + 별도 관리형 PostgreSQL + 서버 안 Redis예요. 하지만 현재 deploy/lightsail/docker-compose.lightsail.yml에는 postgres 서비스도 있어요. 즉 현재 파일은 DB도 같은 서버에서 실행하는 구성이에요. 이 교재는 목표를 설명하며 기존 파일을 목표 구성으로 바꾸거나 실제 AWS 상태를 확인하지 않았어요."], ["ECR이 없다는 말의 의미", "ECR은 이미지 보관·전달을 위한 레지스트리예요. 이번에는 이미지 파일을 직접 전송하므로 ECR이 필요하지 않아요. 대신 이미지 보관, 전달 실패, 디스크 정리와 정상 버전 추적을 배포 절차가 책임져야 해요."]], "terms": [["런타임", "사용자의 요청을 실제 처리하는 실행 환경과 시간이에요."], ["CI/CD", "변경을 검증하고 배포 가능한 결과물을 만들어 전달하는 과정이에요."], ["관리형 서비스", "공급자가 일부 운영을 맡지만 데이터 모델·접근 권한·복구 검증까지 대신해 주지는 않아요."]], "flow": [["브라우저", "프론트는 기존 환경을 유지하고 API로 요청해요."], ["Nginx", "HTTPS를 받고 같은 호스트의 API로 전달해요."], ["Express", "인증·검증·업무 로직을 실행해요."], ["PostgreSQL · Redis", "DB는 서버 밖 관리형, Redis는 서버 안 컨테이너가 목표예요."]], "questions": [{"q": "GitHub Actions 작업이 끝나면 API도 종료될까요?", "options": ["네, CI가 서버이기 때문이에요.", "아니요, Lightsail에서 컨테이너가 계속 실행돼요.", "Redis가 API를 대신 실행해요."], "answer": 1, "why": "Actions는 배포 작업을 수행하는 실행기예요. 상시 서비스의 실행 장소는 Lightsail이에요."}, {"q": "현재 Compose의 postgres 서비스를 보고 올바르게 판단한 것은?", "options": ["관리형 DB 연결이 완료됐어요.", "별도 관리형 DB 목표와 현재 파일 사이에 차이가 있어요.", "PostgreSQL은 SQL DB가 아니에요."], "answer": 1, "why": "컨테이너 DB와 관리형 DB는 운영 주체와 장애 범위가 달라요. 파일의 존재는 AWS 배포 완료의 증거도 아니에요."}, {"q": "ECR을 사용하지 않을 때 새로 책임져야 하는 일은?", "options": ["이미지 파일 전달·보관·정상 버전 추적", "SQL 문법 변경", "프론트엔드 전체 재작성"], "answer": 0, "why": "레지스트리가 없어진 자리를 파일 전송과 서버의 이미지 관리 절차가 채워요."}], "refs": [["Docker의 구성 요소", "https://docs.docker.com/get-started/docker-overview/"]]}, {"title": "계정과 권한의 좌표", "subtitle": "어디에, 누구의 권한으로 작업하는지 먼저 확인해요.", "analogy": "회사 건물의 안내 데스크에 내 이름이 등록되어 있는 것과, 특정 사무실의 출입증으로 들어온 것은 달라요. Identity Center 사용자 정보는 신원 정보이고, 실제 AWS 계정·역할은 지금 들어와 있는 사무실과 출입증에 가까워요.", "limit": "AWS 계정은 단순 폴더보다 강한 보안·과금 경계예요. 역할을 바꾸거나 계정을 전환하면 같은 명령도 전혀 다른 리소스에 적용될 수 있어요.", "sections": [["계정 · 주체 · 리전은 서로 다른 질문이에요", "계정 ID는 어느 조직의 리소스와 비용인지, 현재 인증 주체는 누가 어떤 역할로 요청하는지, 리전은 리소스를 어디에 만들지 알려 줘요. 이번 목표 리전은 서울 ap-northeast-2예요. Identity Center 사용자 상세 화면만으로 운영 계정에 들어왔다고 판단하면 안 돼요."], ["읽기 확인부터 시작하는 이유", "aws sts get-caller-identity는 현재 자격증명의 Account와 Arn 등을 확인하는 읽기 명령이에요. 이것으로 계정과 주체를 확인하고 Lightsail 리소스 목록·고정 IP·DB·S3 용도를 대조해요. 목록에 보이는 것만으로 재사용을 결정하지 말고 운영 중인 사용자와 변경 영향을 확인해야 해요. 이 교재에서는 해당 AWS 명령을 실행하지 않았어요."], ["인증과 인가는 한 단계가 아니에요", "인증은 누구인지 확인하는 일, 인가는 무엇을 해도 되는지 결정하는 일이에요. 프론트에서 로그인 상태여도 관리자 API 호출이 허용되는 것은 아니죠. AWS에서도 로그인 성공과 Lightsail 방화벽 변경 권한은 별개예요. CI에는 필요한 리소스와 작업으로 제한한 역할을 주고 관리자 장기 키를 넣지 않아요."]], "terms": [["Principal", "AWS 요청을 수행하는 사용자·역할 세션 같은 주체예요."], ["IAM Role", "필요할 때 임시 자격증명으로 맡는 권한 묶음이에요."], ["최소 권한", "담당 작업에 필요한 범위만 허용하는 설계 원칙이에요."]], "flow": [["계정 확인", "예상 회사 계정인지 확인해요."], ["주체 확인", "사용자와 맡은 역할을 확인해요."], ["서울 리전", "리소스 위치를 맞춰요."], ["기존 자원 조사", "재사용 가능성과 영향 범위를 판단해요."]], "questions": [{"q": "Identity Center에 내 이름이 보여요. 바로 서버를 만들어도 될까요?", "options": ["네, 이름이면 충분해요.", "계정 ID·현재 주체·리전을 더 확인해요.", "리전은 생성 후에만 확인해요."], "answer": 1, "why": "사용자 정보 화면은 특정 운영 계정의 역할 세션을 확인하는 절차를 대신하지 못해요."}, {"q": "CI에 필요한 것은 임시 SSH 방화벽 변경뿐이에요. 적절한 권한은?", "options": ["팀원 AdministratorAccess 키", "모든 AWS 서비스 전체 권한", "대상 리소스·작업을 제한한 역할"], "answer": 2, "why": "배포가 침해되더라도 피해 범위를 제한할 수 있도록 설계해요."}, {"q": "서울에서 DB를 못 찾았어요. 가장 먼저 할 일은?", "options": ["동일 DB를 새로 생성", "기존 DB 삭제", "계정과 리전, 리소스 목록을 다시 대조"], "answer": 2, "why": "잘못된 계정·리전을 보고 있는지부터 확인하면 중복 비용과 실수를 줄일 수 있어요."}], "refs": [["현재 인증 주체 확인", "https://docs.aws.amazon.com/cli/latest/reference/sts/get-caller-identity.html"]]}, {"title": "주소와 문: 네트워크", "subtitle": "DNS, IP, 포트와 접근 허용 범위를 연결해요.", "analogy": "도메인은 주소록에 적힌 이름, IP는 건물 주소, 포트는 접수 창구 번호예요. 방화벽은 어떤 출발지에서 그 창구까지 올 수 있는지 정하는 출입 통제선이에요.", "limit": "문에 도착했다고 업무 권한을 얻는 것은 아니에요. 방화벽 통과 뒤에도 SSH 인증이나 API의 로그인·소유권 검증이 필요해요.", "sections": [["DNS와 고정 IPv4", "DNS의 A 레코드는 도메인을 IPv4 주소로 연결해요. 고정 IPv4를 서버에 연결하면 서버 교체 때 주소를 유지하는 데 도움이 돼요. DNS 변경은 캐시와 TTL 때문에 모든 사용자에게 즉시 반영되지 않아요. 프론트의 API URL, DNS, TLS 인증서의 도메인은 함께 맞아야 해요."], ["127.0.0.1:8080:8080을 읽어 볼까요?", "Compose의 포트 매핑은 호스트 주소:호스트 포트:컨테이너 포트예요. 127.0.0.1:8080:8080이면 호스트의 로컬 접근만 API 컨테이너로 전달돼요. 호스트 Nginx가 이 주소에 접근하고 외부 사용자는 443으로 Nginx에 접근해요. Express는 컨테이너 안에서 전달받을 수 있는 주소에 listen해야 해요. 컨테이너 안의 localhost와 호스트 localhost는 서로 달라요."], ["DB·Redis는 고객용 출입구가 필요 없어요", "Redis는 Docker 내부 네트워크에서 API만 사용하고 호스트 포트를 공개하지 않아요. 목표의 관리형 DB는 공개 모드를 끄고 공급자가 허용하는 같은 리전의 사설 연결 경로를 확인해요. 사설 경로가 있다고 TLS·비밀번호가 필요 없어지는 것은 아니에요. IPv4뿐 아니라 IPv6 경로도 의도치 않게 열려 있는지 점검해요."], ["/32는 한 주소만 허용한다는 뜻이에요", "IPv4 CIDR의 /32는 주소 1개를 가리켜요. 배포 실행기의 현재 IPv4/32를 SSH 22에 잠시 허용하면 전 세계를 뜻하는 0.0.0.0/0보다 범위를 좁힐 수 있어요. 담당자의 기존 접근 규칙과 배포용 임시 규칙은 구분해서 관리해야 해요."]], "terms": [["DNS", "이름을 주소로 해석하는 체계예요."], ["Loopback", "현재 네트워크 공간의 자기 자신을 가리키는 주소예요."], ["CIDR", "IP 주소 범위를 접두사 길이로 표현하는 표기예요."]], "flow": [["api 도메인", "DNS가 서버 고정 IP를 알려 줘요."], ["443 포트", "방화벽을 통과한 HTTPS가 Nginx에 도착해요."], ["호스트 127.0.0.1:8080", "외부 직접 접근 없이 API에 전달해요."], ["내부 데이터 연결", "API가 DB와 Redis에 접근해요."]], "questions": [{"q": "API 포트를 8080:8080으로만 공개하면 생길 수 있는 문제는?", "options": ["Nginx를 우회하는 직접 접근", "DB가 자동 암호화됨", "DNS 캐시가 사라짐"], "answer": 0, "why": "호스트 주소를 제한하지 않은 공개는 외부 인터페이스에도 바인딩될 수 있어요. 목표는 loopback 전용이에요."}, {"q": "API 컨테이너의 localhost로 호스트 Nginx를 찾을 수 있나요?", "options": ["언제나 가능해요.", "localhost는 해당 컨테이너 자신이므로 같지 않아요.", "DNS가 없을 때만 가능해요."], "answer": 1, "why": "네트워크 네임스페이스가 다르다는 점이 Docker 연결 문제의 중요한 출발점이에요."}, {"q": "DNS를 이전 IP로 되돌렸어요. 모든 요청이 즉시 복구될까요?", "options": ["네, TTL과 무관해요.", "네, 고정 IP면 즉시예요.", "아니요, 캐시 때문에 전환이 섞여 보일 수 있어요."], "answer": 2, "why": "전환·복귀 시간 동안 양쪽 환경 상태와 DNS 캐시를 고려해야 해요."}], "refs": [["Docker 포트 공개", "https://docs.docker.com/engine/network/port-publishing/"]]}, {"title": "Nginx와 HTTPS", "subtitle": "요청의 입구와 안전한 통신을 이해해요.", "analogy": "Nginx는 건물의 대표 안내 데스크예요. 손님은 대표 번호로 연락하고 안내 데스크가 내부 담당자에게 전달해요. TLS 인증서는 이 안내 데스크가 정말 그 도메인의 담당자인지 확인하는 신분증 역할도 해요.", "limit": "HTTPS는 전송 경로를 보호해요. 잘못된 권한 검사나 SQL 로직을 고쳐 주지는 않아요. 인증서가 정상이어도 로그인·결제가 실패할 수 있어요.", "sections": [["Reverse proxy와 TLS 종료", "브라우저는 Nginx와 TLS 연결을 맺고 Nginx가 Express에 별도의 HTTP 요청을 전달해요. 이를 TLS 종료라고 해요. 이번 구성은 같은 호스트의 loopback을 이용하지만 DB로 가는 연결의 TLS는 별도로 설정해야 해요. 웹 HTTPS 인증서 하나가 모든 통신을 암호화하지는 않아요."], ["프록시를 지나면 원래 요청 정보가 필요해요", "Express가 보는 직접 연결 상대는 Nginx예요. 원래 IP와 HTTPS 여부를 전달하는 헤더가 필요하며 Express의 trust proxy 설정은 신뢰할 프록시 경계에 맞아야 해요. 임의의 전달 헤더를 모두 믿으면 IP 기반 제한이나 보안 판단이 잘못될 수 있어요."], ["발급보다 갱신까지가 운영이에요", "인증 기관은 도메인 제어권을 확인한 뒤 인증서를 발급해요. HTTP-01 방식은 80번 포트의 challenge 경로를 사용하는 방식이고 DNS-01은 DNS TXT 기록을 사용해요. 자동 갱신 작업과 갱신 후 Nginx가 새 인증서를 읽는 reload, 만료 알림까지 확인해요. 임시 도메인도 그 이름에 맞는 인증서가 필요해요."]], "terms": [["Reverse proxy", "클라이언트 앞에서 요청을 받아 내부 서버로 전달하는 서버예요."], ["TLS", "암호화와 상대 신원 검증을 제공하는 통신 프로토콜이에요."], ["SNI", "TLS 연결 때 접속할 호스트 이름을 전달하는 기능이에요."]], "flow": [["도메인 검증", "인증 기관이 도메인 제어권을 확인해요."], ["인증서 설치", "Nginx에 인증서와 키를 연결해요."], ["HTTPS 전달", "443에서 API의 로컬 포트로 전달해요."], ["자동 갱신 점검", "갱신·reload·만료 모니터링을 확인해요."]], "questions": [{"q": "Nginx HTTPS를 켰으니 DB 연결도 TLS인가요?", "options": ["네, 서버 전체에 적용돼요.", "아니요, DB 연결은 따로 검증해요.", "Redis만 자동 적용돼요."], "answer": 1, "why": "TLS는 연결마다 설정해요. 브라우저–Nginx와 API–DB는 다른 연결이에요."}, {"q": "인증서 발급에 성공한 다음 꼭 확인할 것은?", "options": ["갱신과 reload, 만료 감시", "API 비밀번호 제거", "모든 포트 공개"], "answer": 0, "why": "발급 한 번의 성공과 몇 달 뒤에도 정상 운영되는 것은 달라요."}, {"q": "프록시 뒤 Express의 IP 정보가 이상해요. 검토할 것은?", "options": ["SQL 인덱스만 수정", "trust proxy와 전달 헤더의 신뢰 경계", "프론트 CSS"], "answer": 1, "why": "신뢰 가능한 프록시에서 전달된 정보인지 확인해야 해요."}], "refs": [["Nginx 입문", "https://nginx.org/en/docs/beginners_guide.html"], ["인증서 challenge", "https://letsencrypt.org/docs/challenge-types/"], ["Express 프록시 설정", "https://expressjs.com/en/guide/behind-proxies.html"]]}, {"title": "이미지를 만들고 운반하기", "subtitle": "빌드와 실행, 파일과 데이터의 경계를 배워요.", "analogy": "Docker 이미지는 검수된 설치 키트, 컨테이너는 그 키트로 차린 작업 공간이에요. 볼륨은 작업 공간을 바꿔도 남겨야 하는 별도 보관함이에요.", "limit": "이미지가 동일해도 환경변수·외부 DB·CPU 아키텍처가 다르면 실행 결과는 달라질 수 있어요. 재현성은 이미지뿐 아니라 설정과 의존 서비스도 함께 관리해야 얻을 수 있어요.", "sections": [["이미지와 컨테이너와 볼륨", "이미지는 실행 파일·Node 환경·라이브러리의 층으로 구성돼요. 컨테이너는 이미지에서 시작한 실행 인스턴스이고 쓰기 가능한 층을 갖지만 교체하면 그 층의 변경은 잃을 수 있어요. Redis 데이터처럼 남겨야 할 것은 볼륨으로 분리해요. docker compose down -v는 볼륨도 제거하므로 배포 절차에 넣지 않아요."], ["서버에서 빌드하지 않는 이유", "2GB 서버에서 npm 설치와 이미지 빌드를 하면 서비스와 CPU·메모리·디스크를 경쟁해요. GitHub에서 빌드하고 서버는 결과물만 실행하도록 역할을 나눠요. Node 22 기반 이미지와 서버 CPU 아키텍처도 맞춰야 해요. npm ci는 lockfile을 기준으로 의존성을 설치하지만 그것만으로 전체 공급망 검증이 끝나지는 않아요."], ["SHA 태그와 체크섬은 다른 식별자예요", "커밋 SHA 태그는 어느 소스에서 만들었는지 추적하기 위한 이름이에요. 태그 자체는 재지정할 수 있어 불변성은 절차로 지켜야 해요. 압축 파일의 SHA-256 체크섬은 전송 전후 파일이 같은지 확인해요. 공격자가 파일과 체크섬을 모두 바꿀 수 있다면 체크섬만으로 출처를 증명할 수 없어요. SSH의 신뢰 검증이 함께 필요해요."], ["save와 load, 그리고 보관", "docker save는 이미지와 태그 정보를 파일로 내보내고 gzip은 전송 크기를 줄여요. 서버에서 검증 후 docker load로 이미지를 등록해도 컨테이너는 아직 바뀌지 않아요. 새 이미지로 실행하는 단계가 따로 필요해요. 정상 이미지와 롤백 이미지를 남긴 뒤 나머지를 정리하고 압축 파일·이미지 층·로그를 포함한 디스크 여유를 확인해요."]], "terms": [["Image", "실행 환경과 프로그램을 담은 배포 단위예요."], ["Container", "이미지를 실행한 격리된 프로세스 환경이에요."], ["Volume", "컨테이너 교체와 별개로 유지할 저장 공간이에요."]], "flow": [["build · SHA 태그", "CI에서 소스와 실행 환경을 묶어요."], ["save · gzip", "이미지를 압축 파일로 운반해요."], ["checksum · load", "서버에서 파일 검증 뒤 등록해요."], ["컨테이너 교체", "등록된 새 이미지로 API를 실행해요."]], "questions": [{"q": "docker load가 성공했어요. 새 API가 실행 중인가요?", "options": ["아니요, 컨테이너 교체가 따로 필요해요.", "네, 자동으로 바뀌어요.", "DB도 새 이미지로 바뀌어요."], "answer": 0, "why": "load는 이미지 등록이고 실행 프로세스를 교체하는 명령은 아니에요."}, {"q": "압축 파일과 체크섬을 둘 다 공격자가 바꾸었다면?", "options": ["체크섬이 출처까지 보장해요.", "체크섬만으로는 공격을 판별할 수 없어요.", "커밋 태그가 암호 키예요."], "answer": 1, "why": "무결성 비교와 신뢰할 수 있는 출처 확인을 구분하세요."}, {"q": "배포 후 Redis 데이터가 사라졌어요. 위험한 명령은?", "options": ["docker image save", "docker image load", "docker compose down -v"], "answer": 2, "why": "-v는 볼륨 삭제를 포함해요. API 버전 교체 때문에 데이터 저장소를 제거하면 안 돼요."}], "refs": [["이미지 저장", "https://docs.docker.com/reference/cli/docker/image/save/"], ["볼륨", "https://docs.docker.com/engine/storage/volumes/"]]}, {"title": "환경변수의 전달 경로", "subtitle": "파일을 고쳤는데 왜 반영되지 않을까요? 누가, 언제 읽는지 찾아봐요.", "analogy": "환경변수 파일을 주문서라고 생각해 보세요. 주문서를 책상 위에 놓는 것과 요리사에게 전달하는 것은 달라요. Compose는 주문서를 읽어 실행 구성을 만들고, 컨테이너는 생성될 때 전달받은 주문대로 시작해요.", "limit": "환경변수는 실시간 공유 상태가 아니에요. React state를 바꾸듯 파일 수정이 실행 중인 모든 프로세스에 자동 전파되지 않아요.", "sections": [["첫 번째 질문: 누가 이 파일을 읽나요?", "파일 이름이 .env라고 모든 도구가 자동으로 읽지는 않아요. Compose의 기본 .env 또는 --env-file은 YAML의 ${NAME} 치환에 쓰여요. 서비스의 env_file은 컨테이너 환경에 변수를 넣는 역할이에요. Node 앱의 dotenv는 앱이 명시적으로 호출할 때 파일을 process.env로 읽어요. 이 세 독자를 먼저 구별하면 “파일에는 있는데 앱에는 없다”를 추적할 수 있어요."], ["두 번째 질문: 같은 이름을 누가 덮어쓰나요?", "컨테이너에 주입할 값은 서비스 environment가 env_file보다 우선해요. 따라서 environment에 DB_HOST: postgres가 고정돼 있다면 env_file의 DB_HOST를 관리형 DB 주소로 바꿔도 그 값이 이기지 못해요. 현재 Compose에는 DATABASE_URL을 빈 문자열로 설정하고 DB_HOST를 postgres로 강제하는 부분이 있어요. 파일을 복사하기 전에 이 설정과 앱의 DB URL 생성 로직을 함께 확인해야 해요. Dockerfile ENV는 실행 시 주입값에 덮어써질 수 있어요."], ["우리 코드에서 한 번 더 덮어쓰는 곳", "config/loadEnv.js는 .env를 읽고, 호출 전에 있던 NODE_ENV 값으로 .env.production 같은 파일을 선택해 override: true로 읽어요. 즉 그 파일이 존재하면 이미 주입된 process.env도 바뀔 수 있어요. NODE_ENV를 첫 .env 안에서만 설정하면 여기서는 두 번째 파일 선택에 반영되지 않는다는 점도 주의하세요. scripts/run-prisma.js는 첫 .env를 읽은 뒤 NODE_ENV를 확인하므로 읽는 시점이 달라요. Docker 주입 우선순위를 확인한 뒤 앱 내부 로더까지 따라가야 최종값을 알 수 있어요."], ["운영 이미지에 그 파일이 실제로 있나요?", "현재 .dockerignore는 .env와 .env.*를 제외하고 .env.example만 허용해요. 따라서 정상적으로 빌드한 이미지에는 로컬 .env.production이 자동 복사되지 않아요. 앱 로더에 override 코드가 있다는 사실만으로 지금 운영값을 덮어쓰고 있다고 단정할 수는 없어요. 별도 마운트나 수동 복사로 파일이 존재하는지, 프로세스 작업 디렉터리가 어디인지까지 확인해야 해요."], ["세 번째 질문: 언제 읽나요?", "Docker build의 ARG는 빌드용, 컨테이너 environment는 실행용이에요. GitHub의 Secrets에 저장했다고 서버 컨테이너로 자동 전달되지는 않아요. workflow가 어디서 사용하는지 확인해야 해요. Next 공개 환경변수는 빌드 시 번들에 반영되는 경우가 있지만, Express의 process.env는 프로세스 환경을 읽어요. 다만 모듈 로딩 때 const로 저장했다면 이후 변경도 그 상수에 자동 반영되지 않아요."], ["restart와 recreate를 구분해요", "Compose 설정이나 env_file을 바꾼 뒤 docker compose restart만 실행하면 기존 컨테이너의 생성 환경이 유지돼요. 변경한 실행 구성을 적용하려면 해당 서비스 컨테이너를 재생성해야 해요. 예를 들어 검토한 Compose와 환경 파일을 명시하고 up -d --no-deps --force-recreate api를 사용하는 방식이 있어요. 이는 API 중단을 동반할 수 있는 운영 변경이며 이 교재에서 실행하지 않아요. 이미지에 구워진 빌드 설정을 바꿀 때는 CI 재빌드가 별도로 필요해요."], ["값은 기본적으로 문자열이에요", "process.env.FLAG의 \"false\"는 JavaScript에서 truthy예요. if (process.env.FLAG)로 참·거짓을 판단하면 의도와 다르게 켜질 수 있어요. FLAG === \"true\"처럼 허용한 값을 명시적으로 해석하고 숫자는 변환 후 유한값·범위를 검증해요. 빈 문자열, 아예 없음(undefined), \"false\"는 서로 다른 값이에요. Python의 os.environ도 문자열이라는 점을 떠올려 보세요."]], "terms": [["Interpolation", "Compose가 ${NAME} 자리에 값을 넣어 설정을 만드는 과정이에요."], ["env_file", "서비스 컨테이너에 환경변수를 주입할 파일을 지정하는 항목이에요."], ["Recreate", "변경된 생성 설정으로 컨테이너를 새로 만드는 일이에요."]], "flow": [["설정 원본", "셸·Compose 치환 파일·서비스 env_file을 구분해요."], ["Compose 해석", "environment와 치환 결과가 최종 구성을 만들어요."], ["컨테이너 생성", "새 프로세스에 환경을 주입해요."], ["앱 해석", "process.env를 문자열로 읽고 검증·변환해요."]], "questions": [{"q": "env_file에 새 DB_HOST를 넣었지만 environment에 postgres가 있어요. 결과는?", "options": ["새 주소가 항상 이겨요.", "environment의 postgres가 우선해요.", "둘을 합쳐 연결해요."], "answer": 1, "why": "서비스 environment가 env_file 값을 덮어써요. 현재 저장소에서도 꼭 확인할 충돌이에요."}, {"q": "env_file을 수정하고 restart했는데 값이 그대로예요. 이유는?", "options": ["기존 생성 환경으로 같은 컨테이너를 재시작했기 때문", "Redis 캐시 때문이라고 확정", "파일 이름을 무조건 .env.local로 바꿔야 함"], "answer": 0, "why": "주입 환경 변경은 서비스 재생성이 필요해요. 먼저 어떤 Compose 파일과 환경 파일을 사용했는지도 확인해요."}, {"q": "FLAG=\"false\"일 때 if (process.env.FLAG)는?", "options": ["false", "undefined", "참으로 평가돼요."], "answer": 2, "why": "비어 있지 않은 문자열은 truthy예요. boolean 의미로 사용하려면 명시적으로 파싱하세요."}, {"q": "GitHub Secrets에 DB 비밀번호를 등록했어요. API에 자동 반영되나요?", "options": ["아니요, workflow와 서버 런타임의 전달 경로가 필요해요.", "네, 같은 저장소면 자동이에요.", "프론트 번들에만 자동 주입돼요."], "answer": 0, "why": "비밀을 보관하는 장소와 소비하는 프로세스가 다르다는 점을 확인해요."}], "refs": [["Compose 환경변수 우선순위", "https://docs.docker.com/compose/how-tos/environment-variables/envvars-precedence/"], ["Compose 치환", "https://docs.docker.com/compose/how-tos/environment-variables/variable-interpolation/"], ["restart의 적용 범위", "https://docs.docker.com/reference/cli/docker/compose/restart/"], ["Node 환경변수", "https://nodejs.org/api/environment_variables.html"]]}, {"title": "환경변수 문제 해결 실습", "subtitle": "증상에서 출발해서 비밀을 노출하지 않고 원인을 좁혀요.", "analogy": "전등이 안 켜질 때 발전소부터 바꾸지는 않죠. 전구, 스위치, 차단기 순으로 구간을 나누듯 설정 파일, 컨테이너 주입, 앱 해석, 실제 연결을 한 구간씩 확인해 보세요.", "limit": "접속 오류는 설정 누락 외에도 네트워크·권한·인증서·서비스 장애로 생길 수 있어요. 환경변수 한 줄만 고쳐 모든 문제를 설명하려 하지 않는 것이 중요해요.", "sections": [["증상 1: 값이 없거나 예전 값이에요", "사용한 Compose 파일 경로와 --env-file, 서비스 이름을 먼저 확인해요. 작업 디렉터리가 바뀌면 다른 파일을 읽을 수 있어 명시적인 경로가 도움이 돼요. 필수 설정은 시작할 때 누락·빈 값·허용 형식을 검증해서 빠르게 실패하게 해요. 전체 env 출력 대신 특정 키의 존재 여부와 빈 값 여부만 확인하세요. docker compose config나 docker inspect는 비밀이 펼쳐질 수 있으니 출력 전체를 채팅·CI 로그에 붙이지 않아요."], ["증상 2: DB 비밀번호는 맞는데 URL 접속이 실패해요", "postgresql://USER:PASSWORD@HOST:5432/DB 형태에서 @, :, /, #, % 같은 문자는 URL 문법과 충돌할 수 있어요. 비밀번호 구성 요소만 percent-encoding하고 URL 전체를 인코딩하거나 이미 인코딩된 값을 또 인코딩하지 않아요. 예시 가짜 비밀번호 demo@pw는 URL 안에서 demo%40pw가 돼요. 별도 DB_PASSWORD 필드로 드라이버에 전달할 때와 URL에 삽입할 때의 표현은 다를 수 있어요."], ["증상 3: 컨테이너에서만 DB 연결이 안 돼요", "DB_HOST=localhost면 API 컨테이너 자신을 가리켜요. 같은 Compose DB는 서비스 이름 postgres, 목표 관리형 DB는 공급자 endpoint를 사용해요. 이름 해석 → TCP 경로 → TLS 검증 → 계정 인증 → DB·스키마 권한 순서로 나누면 원인을 좁히기 좋아요. TCP 연결 성공만으로 SQL 권한까지 증명되지는 않아요."], ["증상 4: 비밀번호의 $ 뒤가 사라져요", "셸·Compose·dotenv는 각기 인용과 치환 규칙을 갖고 있어요. YAML의 컨테이너 명령에서 $$는 Compose 치환을 피하고 $를 다음 단계로 전달할 때 쓰지만 모든 환경 파일 비밀번호에 일괄 적용하는 규칙은 아니에요. 자신이 편집한 파일을 누가 파싱하는지 확인하고 가짜 특수문자 값으로 먼저 실험하세요. export 문법이나 따옴표를 다른 도구용 파일에 무조건 복사하지 않아요."], ["증상 5: 앱은 되는데 migration은 다른 DB를 봐요", "API 프로세스와 마이그레이션 명령이 동일한 DB·스키마·TLS 설정을 사용하는지 확인해요. DATABASE_URL과 DB_HOST 등 개별 설정이 동시에 있으면 코드의 우선순위를 읽어야 해요. 마이그레이션용 환경을 따로 만들었다면 실제 대상 일치 검증이 특히 중요해요. 로컬 테스트가 운영 DB를 바라보지 않도록 실행 전 대상을 구분하세요."], ["이 저장소의 URL 선택 규칙", "config/prismaClient.js와 scripts/run-prisma.js는 비어 있지 않은 DATABASE_URL을 먼저 사용해요. 없거나 빈 문자열이면 DB_HOST·DB_USER·DB_PASSWORD·DB_NAME으로 조립하며 사용자와 비밀번호에 encodeURIComponent를 적용해요. 따라서 개별 DB_PASSWORD에 이미 %40으로 인코딩한 값을 넣으면 다시 인코딩될 수 있어요. 개별 필드는 원문, 직접 완성하는 URL은 해당 구성 요소를 인코딩한다는 계약을 지켜요. 이 조립 경로에는 관리형 DB의 TLS 옵션을 자동으로 넣는 코드가 없으므로 목표 구성의 TLS 검증을 별도로 준비해야 해요."], ["안전하게 남길 진단 기록", "“키 이름 / 값을 주는 위치 / 읽는 프로세스 / 반영 시점 / 검증 결과”를 표로 기록해 보세요. 예를 들어 DB_HOST는 서비스 environment, API·migration, 재생성 시, 예상 대상 일치 여부로 기록할 수 있어요. 비밀번호·토큰·개인키 원문은 기록하지 않아요. 설정 변경 후 연결과 로그인 등 실제 소비 기능을 다시 확인하면 문제 해결이 완성돼요."]], "terms": [["Percent-encoding", "URL에서 특별한 의미를 가진 문자를 %와 코드로 표현하는 방법이에요."], ["Fail fast", "필수 설정 오류를 시작 단계에서 발견해 모호한 후속 장애를 줄이는 방식이에요."], ["설정 계약", "필수 여부·형식·기본값·사용 주체를 명시한 약속이에요."]], "flow": [["주입 확인", "파일·우선순위·컨테이너 재생성을 확인해요."], ["파싱 확인", "문자열·빈 값·특수문자를 확인해요."], ["연결 계층 확인", "DNS·TCP·TLS·인증·권한을 구분해요."], ["소비 기능 재검증", "API·migration·인증 연동의 실제 동작을 확인해요."]], "questions": [{"q": "가짜 비밀번호 demo@pw를 DB URL 비밀번호 위치에 넣으려면?", "options": ["전체 URL을 encodeURIComponent 처리", "비밀번호 구성 요소를 demo%40pw로 표현", "@ 뒤를 삭제"], "answer": 1, "why": "구성 요소만 인코딩해요. 전체 URL의 ://와 @ 같은 구분자까지 인코딩하면 URL 구조가 깨져요."}, {"q": "설정 문제를 공유할 때 적절한 자료는?", "options": ["printenv 전체", "키 이름·주입 경로·존재 여부·비밀 제거한 오류", "운영 DATABASE_URL 원문"], "answer": 1, "why": "문제 추적에 필요한 구조를 남기고 비밀은 노출하지 않아요."}, {"q": "API 컨테이너에 DB_HOST=localhost를 넣었어요. 어느 곳인가요?", "options": ["관리형 DB 자동 탐색", "호스트 서버", "API 컨테이너 자신"], "answer": 2, "why": "관리형 DB endpoint와 Docker 서비스 이름, localhost의 의미를 분리하세요."}, {"q": "API는 정상인데 migration이 엉뚱한 D 업·볼륨·메모리 정책을 정해요."], ["실패와 복원 시험", "메모리 초과와 재시작 후 실제 결과를 확인해요."]], "questions": [{"q": "인증 코드가 TTL 전인데 메모리 부족으로 사라졌어요. 무엇이 작동했나요?", "options": ["DNS", "Eviction", "SQL JOIN"], "answer": 1, "why": "TTL에 의한 정상 만료와 메모리 압박에 의한 조기 삭제는 원인이 달라요."}, {"q": "noeviction을 켜면 용량이 부족해도 모든 쓰기가 성공하나요?", "options": ["네, 메모리가 자동 확장돼요.", "네, 디스크로 전환돼요.", "아니요, 쓰기 실패를 처리해야 해요."], "answer": 2, "why": "임의 삭제를 피하는 대신 쓰기 거절이라는 실패 형태를 운영에서 다뤄야 해요."}, {"q": "DB 연결이 암호화됐다는 사실만으로 충분한가요?", "options": ["CA와 호스트 검증도 확인해요.", "네, 어떤 서버든 안전해요.", "저장 암호화는 자동이에요."], "answer": 0, "why": "암호화된 연결의 상대가 진짜 DB 서버인지도 확인해야 해요."}], "refs": [["PostgreSQL TLS 검증", "https://www.postgresql.org/docs/16/libpq-ssl.html"], ["Redis eviction", "https://redis.io/docs/latest/develop/reference/eviction/"], ["Redis 영속성", "https://redis.io/docs/latest/operate/oss_and_stack/management/persistence/"]]}, {"title": "CI/CD를 하나의 절차로", "subtitle": "성공 경로뿐 아니라 실패 지점을 설계해요.", "analogy": "배포는 택배 발송과 비슷해요. 제품 검사, 포장, 송장, 배송 확인, 설치 확인이 서로 다른 단계예요. 발송 완료를 설치 완료라고 부르면 문제가 생기겠죠?", "limit": "배포는 원자적인 DB 트랜잭션이 아니에요. 앞 단계의 변경이 남은 상태로 다음 단계가 실패할 수 있어 각 단계의 기록과 복구 방법이 필요해요.", "sections": [["검증과 전달과 전환을 나누어요", "checkout → npm ci·검증 → 이미지 build·SHA 태그 → save·gzip → 체크섬과 전송 → 서버 검증·load → 마이그레이션 → API 교체 → 내부·외부 확인 → 결과 기록 순서예요. 실패 시 이미 무엇이 바뀌었는지 알아야 하므로 커밋·이미지 식별자·시간·상태를 남겨요. 로그에는 비밀을 남기지 않아요."], ["수동 실행도 자동화예요", "workflow_dispatch는 사람이 시작하지만 이후 절차는 자동으로 수행할 수 있어요. 처음에는 검증된 커밋을 선택해 수동 배포하고, 검증 완료 후 보호된 브랜치나 릴리스 태그와 연결해요. 현재 workflow는 release/lightsail 조건이 있어요. develop을 안다는 이유로 모든 커밋을 운영에 배포하지 않아요."], ["concurrency는 충돌을 막는 장치예요", "같은 환경의 배포가 겹치면 A가 올린 이미지를 B가 바꾸거나 임시 방화벽 정리가 충돌할 수 있어요. 동일 concurrency group과 cancel-in-progress: false는 진행 중 배포를 새 실행이 강제로 중단하지 않게 해요. 기본 대기 설정에서는 이전 pending 실행이 새 실행으로 대체될 수 있어 모든 요청이 FIFO로 보존된다고 가정하면 안 돼요."], ["성공과 보관의 기준", "현재 정상 버전과 이전 정상 이미지를 남기고 외부 HTTPS 결과까지 기록한 뒤 정리해요. 큰 이미지 파일을 GitHub Artifact에 장기간 쌓지 않아요. CI 시간·저장 용량은 요금 조건에 영향을 줄 수 있어요. 배포 로그는 어떤 단계까지 성공했는지 설명할 수 있을 정도로 남겨요."]], "terms": [["workflow_dispatch 필요하며 자동 다운그레이드·초기화를 하지 않아요. 복원 DB를 검증하고 연결을 전환하는 동안 신규 쓰기를 어떻게 다룰지도 정해야 해요."], ["RPO와 RTO로 복구를 구체화해요", "RPO는 얼마나 최근 데이터까지 잃어도 되는지, RTO는 얼마 안에 서비스를 회복해야 하는지예요. 10분 전 백업만 있으면 그 후의 주문 처리 계획이 필요해요. 백업 파일이 존재한다는 사실과 분리된 환경에 복원해 업무 데이터를 검증했다는 것은 다른 증거예요."]], "terms": [["Migration", "버전 관리하는 DB 구조 변경 절차예요."], ["Expand–contract", "호환 가능한 확장 후 전환하고 마지막에 이전 구조를 제거하는 전략이에요."], ["RPO / RTO", "허용 데이터 손실 시간 / 목표 복구 시간이에요."]], "flow": [["호환성 검토", "구버전도 변경된 DB에서 동작하는지 봐요."], ["백업·복원 계획", "위험 변경의 데이터 복구 수단을 확보해요."], ["마이그레이션 1회", "실패하면 API 교체를 멈춰요."], ["교체·관찰", "정상 확인 후 후속 정리 시점을 판단해요."]], "questions": [{"q": "새 버전이 컬럼을 삭제한 뒤 실패했어요. 이미지 롤백만으로 충분할까요?", "options": ["네, DB도 이미지 안에 있어요.", "아니요, 구버전 DB 호환성과 데이터 복구가 별도예요.", "서버 재부팅하면 돌아와요."], "answer": 1, "why": "코드와 영속 데이터는 수명이 달라요. 파괴적 변경 전에 복구 계획이 필요해요."}, {"q": "마이그레이션을 배포 단계와 시작 스크립트 양쪽에서 실행하면?", "options": ["안전성이 두 배예요.", "언제나 필수예요.", "중복·경합을 피하도록 책임을 한 곳으로 모아요."], "answer": 2, "why": "배포 단계에서 실행하고 앱 시작에서는 자동 실행을 끄는 식으로 일관되게 구성해요."}, {"q": "컬럼 이름을 안전하게 전환하는 첫 단계는?", "options": ["기존 컬럼 즉시 삭제", "DB 초기화", "새 구조를 추가하고 구버전과 호환 유지"], "answer": 2, "why": "호환 구간을 두면 새 API 실패 시 이전 이미지로 복귀할 가능성을 확보할 수 있어요."}], "refs": [["Prisma 배포 마이그레이션", "https://www.prisma.io/docs/orm/prisma-migrate/workflows/development-and-production"]]}, {"title": "정상이라는 증거 모으기", "subtitle": "헬스 체크부터 업무 검증과 전환까지 연결해요.", "analogy": "가게의 불이 켜져 있는지, 직원과 재료가 준비됐는지, 손님이 실제 주문을 완료할 수 있는지는 다른 질문이에요. 각각 생존·준비·업무 검증에 대응해요.", "limit": "몇 번의 성공 응답만으로 모든 상황을 증명할 수는 없어요. 정상·실패·만료·재시도·복구의 대표 시나리오를 나눠 증거를 모아요.", "sections": [["Liveness · Readiness · 업무 검증", "Liveness는 프로세스가 응답 가능한지, Readiness는 DB·Redis 등 필요한 의존성을 사용할 준비가 됐는지 확인해요. /health 200만으로 로그인·결제·메일까지 정상이라 판단하지 않아요. 의존성 장애 때 무조건 프로세스를 반복 재시작하는 것이 해결책은 아니므로 점검 결과의 용도를 구분해요."], ["안전한 업무 검증", "격리된 PostgreSQL·Redis에서 단위·통합 테스트를 하고 외부 결제는 모의 또는 sandbox 환경으로 확인해요. 임시 API 도메인에서 로그인·주문·업로드·Account 콜백까지 확인해요. 내부 loopback 성공과 외부 DNS·TLS 경로의 성공도 구분해요. 실제 고객 데이터와 실제 과금을 건드리지 않는 테스트 계정을 준비해요."], ["종료 중 요청과 반복 작업", "SIGTERM을 받으면 새 요청 수락을 멈추고  담당자와 검증·복귀 순서를 설명해야 해요. 비밀 값을 인수인계 문서에 복사하지 않아요."], ["작성 · 로컬 검증 · AWS 실행을 분리해요", "파일을 작성했다는 것은 구성 의도를 만든 상태예요. 문법과 격리된 테스트를 통과했다는 것은 로컬 검증이에요. 실제 계정·서버·DNS·TLS·운영 인증으로 확인한 것은 별도의 운영 증거예요. 현재 저장소의 파일이나 과거 문서만 보고 지금 AWS에서 정상 운영 중이라고 단정하지 않아요."], ["완료 판단은 질문에 답할 수 있는 상태예요", "현재 정상 커밋은 무엇인지, 배포가 어디서 실패했는지, 이전 API로 어떻게 돌아가는지, DB 복원에 얼마 걸리는지, 인증서 만료와 디스크 부족을 누가 확인하는지 설명할 수 있어야 해요. 남는 위험은 API 단일 장애 지점, Standard DB의 장애·점검, 외부 인증·결제 의존성, 비용 변동이에요. 담당자와 점검 주기를 남기면 인수인계가 실제 운영으로 이어져요."]], "terms": [["기본 비용", "정해진 구성의 기준 요금이며 총 청구액과 달라요."], ["HA", "일부 구성 요소 장애에도 서비스를 지속하도록 설계한 고가용성이에요."], ["Runbook", "담당자가 반복 작업·장애 복구를 따라 할 수 있는 운영 절차서예요."]], "flow": [["구성·비용 확인", "서울 콘솔의 실제 선택 항목을 대조해요."], ["산출물 연결", "설정·권한·전환 절차의 역할을 확인해요."], ["검증 수준 표시", "작성·로컬 검증·실제 실행을 구분해요."], ["담당자 인계", "복구 절차·점검 주기·남은 위험을 전달해요."]], "questions": [{"q": "서버 $12와 DB $30이면 최종 월 청구액이 반드시 $42인가요?", "options": ["네, 모든 부대 비용 포함", "아니요, 기본료 외 항목과 실제 요금을 확인해요.", "GitHub는 언제나 무제한 무료예요."], "answer": 1, "why": "계획의 기본 비용과 실제 사용량을 포함한 청구액을 구분하세요."}, {"q": "workflow 파일이 저장소에 있어요. 무엇이 증명되나요?", "options": ["운영 배포 성공", "실제 HTTPS 인증서 갱신 성공", "배포 절차가 파일로 작성되어 있음"], "answer": 2, "why": "실행 결과·테스트 기록·운영 확인은 각각 별도의 증거예요."}, {"q": "인수인계에서 가장 유용한 기록은?", "options": ["서버 이름만", "비밀 키를 붙인 문서", "정상 버전·검증 결과·복구 순서·담당자"], "answer": 2, "why": "비밀은 안전한 전달 체계로 관리하고, 문서에는 운영 판단과 행동에 필요한 근거를 남겨요."}], "refs": [["Lightsail 가격 확인", "https://aws.amazon.com/lightsail/pricing/"], ["GitHub Actions 과금", "https://docs.github.com/en/billing/concepts/product-billing/github-actions"]]}];</script><script>(() => {

  function updateProgress(){$('#score').textContent=`복습 정답 ${count()} / ${total}`;$('#progress').max=total;$('#progress').value=count();$('#storage-state').textContent=storageOK?'진도와 메모는 이 브라우저에 저장돼요.':'저장이 제한되어 이번 화면에서만 유지돼요.';}

  addEventListener('resize',()=>menu(false));addEventListener('keydown',e=>{if(e.key==='Escape'){menu(false);$('#menu').focus();}});
  function nav(i){$('#nav').innerHTML=`<a href="#home" ${i===-1?'class="active" aria-current="page"':''}>전체 학습 지도</a>`+LESSONS.map((l,n)=>`<a href="${url(n)}" ${n===i?'class="active" aria-current="page"':''}><span>${String(n+1).padStart(2,'0')}</span>${esc(l.title)}</a>`).join('')+`<div class="tools"><a href="#glossary">개념 사전</a><a href="#review">틀린 문제 다시 보기</a><a href="#envlab">환경변수 실험실</a></div>`;updateProgress();}
  function home(){nav(-1);$('#crumb').textContent='학습 지도';$('#main').innerHTML=`<section class="hero"><div class="hero-text"><div class="eyebrow">FROM FRONTEND TO DEPLOYMENT</div><h1>배포가 이해되는 순간,<br>운영이 덜 낯설어져요.</h1><p>익숙한 React·Next 경험에서 출발해 서버, 환경변수, 데이터와 자동 배포를 차근차근 연결해 봐요.</p>${button(url(0),'첫 개념부터 시작하기',true)}</div><div class="hero-art" aria-label="서비스와 배포 흐름"><div class="path-label">01 / 사용자의 요청</div><div class="node-row"><div class="node">브라우저</div><span class="connector">→</span><div class="node accent">Nginx · API</div></div><div class="sub">별도 관리형 PostgreSQL + 서버 내부 Redis</div><div class="path-label">02 / 코드가 도착하는 길</div><div class="node-row"><div class="node">GitHub Actions</div><span class="connector">→</span><div class="node">Lightsail</div></div><div class="sub">빌드 · 압축 · SSH 전송 · 검증 · 교체</div></div></section><div class="stats"><div><strong>${LESSONS.length}</strong><span>개념 중심 단원</span></div><div><strong>${total}</strong><span>상황형 복습 퀴즈</span></div><div><strong>02</strong><span>환경변수 집중 단원</span></div><div><strong>${count()} / ${total}</strong><span>지금까지 맞힌 문제</span></div></div><div class="columns"><section><div class="section-heading"><h2>나의 학습 여정</h2><span class="tiny muted">개념 이해 후 복습 퀴즈</span></div>${LESSONS.map((l,i)=>`<a class="course" href="${url(i)}"><span class="num">${String(i+1).padStart(2,'0')}</span><div><h3>${esc(l.title)}</h3><p>${esc(l.subtitle)}</p></div><span class="badge ${i===5||i===6?'focus':''}">${i===5||i===6?'집중 학습':state.read[i]?'개념 읽음':`${l.questions.length}문제`}</span></a>`).join('')}</section><aside><div class="panel"><div class="eyebrow">HOW TO LEARN</div><h3>명령어보다 이유를 먼저</h3><p class="tiny muted">개념과 비유를 읽고 흐름의 단계를 눌러 보세요. 마지막에는 문제를 풀고 자신의 말로 설명을 남겨요.</p>${button('#envlab','환경변수 실험실')}</div><div class="panel notice"><h3>목표와 현재를 구분해요</h3><p>목표는 별도 관리형 DB예요. 현재 저장소의 Lightsail Compose에는 PostgreSQL 컨테이너가 포함돼 있어요.</p><p>이 페이지는 학습 교재예요. 실제 AWS 구성·배포를 실행한 결과가 아니에요.</p></div><div class="panel reference"><h3>함께 읽는 저장소 자료</h3><a href="../../deploy/lightsail/README.md">현재 Lightsail 운영 문서</a><a href="../../deploy/lightsail/docker-compose.lightsail.yml">현재 Compose 구성</a><a href="../../.github/workflows/deploy-dev.yml">현재 GitHub workflow</a><a href="../study/index.html">기존 백엔드 코드 학습실</a><p class="tiny muted">HTML만 다른 폴더로 복사해도 수업과 퀴즈는 동작해요. 저장소 링크는 원래 위치에서 이용해 주세요.</p></div></aside></div>`;}
  function aside(l){return `<aside class="sticky"><div class="panel"><h3>꼭 알아둘 말</h3>${l.terms.map(([t,d])=>`<div class="term"><strong>${esc(t)}</strong><p>${esc(d)}</p></div>`).join('')}</div><div class="panel reference"><h3>공식 문서에서 더 읽기</h3>${l.refs.map(([t,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(t)}</a>`).join('')}<p class="tiny muted">외부 문서는 인터넷이 필요해요. 설치 버전과 문서 버전을 대조해 주세요.</p></div></aside>`;}
  function lesson(i,tab,qi){const l=LESSONS[i];nav(i);$('#crumb').textContent=l.title;const quiz=tab==='quiz';$('#main').innerHTML=`<div class="lesson-head"><div class="eyebrow">LESSON ${String(i+1).padStart(2,'0')} / ${LESSONS.length}${i===5||i===6?' · ENVIRONMENT FOCUS':''}</div><h1>${esc(l.title)}</h1><p>${esc(l.subtitle)}</p></div><nav class="tabs" aria-label="학습 단계"><a href="${url(i)}" class="${!quiz?'active':''}" ${!quiz?'aria-current="page"':''}>01 개념 이해하기</a><a href="${url(i,'quiz')}" class="${quiz?'active':''}" ${quiz?'aria-current="page"':''}>02 복습 퀴즈</a></nav><div class="columns"><section id="lesson-content"></section>${aside(l)}</div>`;
    if(quiz){renderQuiz(i,qi);return;}
    $('#lesson-content').innerHTML=`<div class="panel analogy"><h3>비유로 먼저 만나 볼까요?</h3><p>${esc(l.analogy)}</p><div class="boundary"><strong>비유를 넘어 기억할 점</strong><br>${esc(l.limit)}</div></div>${l.sections.map(([h,p],n)=>`<article class="panel concept"><h2><span class="index">${String(n+1).padStart(2,'0')}</span>${esc(h)}</h2><p>${esc(p)}</p></article>`).join('')}<div class="panel"><h3>흐름을 짚어 볼까요?</h3><p class="tiny muted">각 단계를 누르면 역할을 확인할 수 있어요.</p><div class="flow">${l.flow.map(([t],n)=>`<button type="button" data-step="${n}" aria-pressed="${n===0}" class="${n===0?'active':''}"><small>STEP ${n+1}</small>${esc(t)}</button>`).join('')}</div><div class="flow-detail" aria-live="polite">${esc(l.flow[0][1])}</div></div>${i===5||i===6?`<div class="panel lab"><h3>가짜 설정으로 직접 확인해요</h3><p>env_file과 environment가 충돌하면 무엇이 이길까요? restart와 recreate까지 작은 모형에서 비교해 보세요.</p>${button('#envlab','환경변수 실험실 열기')}</div>`:''}<div class="panel"><label for="note"><strong>내 말로 설명해 보기</strong></label><p class="tiny muted">“이 설정이 필요한 이유는…”으로 시작해 보세요. 비밀번호나 토큰은 적지 마세요.</p><textarea id="note" class="note" placeholder="이 단원에서 이해한 내용을 적어 주세요.">${esc(state.notes[i]||'')}</textarea><span class="save-label" id="note-status">입력하면 자동 저장해요.</span></div><div class="bottom"><button class="btn" id="read">${state.read[i]?'개념 읽음 표시 완료':'개념 읽음 표시하기'}</button>${button(url(i,'quiz'),'복습 퀴즈 시작하기',true)}</div>`;
    document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-step]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b));});$('.flow-detail').textContent=l.flow[Number(b.dataset.step)][1];});
    $('#note').oninput=e=>{state.notes[i]=e.target.value;save();$('#note-status').textContent=storageOK?'메모를 저장했어요.':'저장이 제한되어 새로고침하면 메모가 사라질 수 있어요.';};$('#read').onclick=e=>{state.read[i]=true;save();e.target.textContent='개념 읽음 표시 완료';};
  }
  function renderQuiz(i,j){const l=LESSONS[i];j=Math.max(0,Math.min(j,l.questions.length-1));const q=l.questions[j],key=`${i}-${j}`,saved=state.answers[key],answered=Number.isInteger(saved)&&saved>=0&&saved<q.options.length;
    $('#lesson-content').innerHTML=`<p class="muted">암기보다 상황을 판단해 보세요. 틀려도 괜찮아요. 이유를 읽고 다시 풀어 봐요.</p><nav class="quiznav" aria-label="문제 선택">${l.questions.map((x,n)=>`<a href="${url(i,'quiz',n)}" class="${j===n?'active ':''}${state.answers[`${i}-${n}`]===x.answer?'done':''}" ${j===n?'aria-current="page"':''}>${n+1}번</a>`).join('')}</nav><div class="panel quiz"><form id="quiz-form"><fieldset><legend>${j+1}. ${esc(q.q)}</legend>${q.options.map((o,n)=>`<label class="choice"><input type="radio" name="answer" value="${n}" required ${answered&&saved===n?'checked':''}><span>${esc(o)}</span></label>`).join('')}</fieldset><button class="btn primary" type="submit">정답과 해설 확인</button></form><div id="feedback" aria-live="polite"></div></div><div class="bottom">${button(url(i),'개념 다시 읽기')}${j+1<l.questions.length?button(url(i,'quiz',j+1),'다음 문제',true):i+1<LESSONS.length?button(url(i+1),'다음 단원 배우기',true):button('#home','학습 지도 돌아가기',true)}</div>`;
    const feedback=a=>{$('#feedback').innerHTML=`<div class="feedback ${a===q.answer?'':'wrong'}"><strong>${a===q.answer?'잘 이해하셨어요.':'괜찮아요. 판단의 기준을 다시 짚어 봐요.'}</strong><p>정답: ${esc(q.options[q.answer])}</p><p>${esc(q.why)}</p>${a!==q.answer?'<p class="tiny">선택을 바꾼 뒤 다시 확인하면 오답 목록에서도 정리돼요.</p>':''}</div>`;};if(answered)feedback(saved);
    $('#quiz-form').onsubmit=e=>{e.preventDefault();const a=Number(new FormData(e.target).get('answer'));state.answers[key]=a;save();feedback(a);};
  }
  function glossary(){nav(-2);$('#crumb').textContent='개념 사전';$('#main').innerHTML=`<div class="lesson-head"><div class="eyebrow">CONCEPT DICTIONARY</div><h1>말의 의미부터 또렷하게</h1><p>용어와 설명, 관련 단원을 함께 찾아보세요.</p></div><label for="search">찾고 싶은 개념</label><input class="search" id="search" type="search" placeholder="예: 환경변수, TLS, 복구"><div id="dictionary" class="dictionary"></div>`;const render=s=>{const items=LESSONS.flatMap((l,i)=>l.terms.map(([t,d])=>({t,d,i,title:l.title}))).filter(x=>`${x.t} ${x.d} ${x.title}`.toLowerCase().includes(s.toLowerCase()));$('#dictionary').innerHTML=items.length?items.map(x=>`<article class="panel"><h3>${esc(x.t)}</h3><p>${esc(x.d)}</p><a href="${url(x.i)}">${esc(x.title)}에서 복습하기</a></article>`).join(''):'<p>일치하는 개념이 없어요. 다른 낱말로 찾아보세요.</p>';};$('#search').oninput=e=>render(e.target.value);render('');}
  function review(){nav(-2);$('#crumb').textContent='오답 복습';const wrong=LESSONS.flatMap((l,i)=>l.questions.map((q,j)=>({q,i,j,l}))).filter(x=>Number.isInteger(state.answers[`${x.i}-${x.j}`])&&state.answers[`${x.i}-${x.j}`]!==x.q.answer);$('#main').innerHTML=`<div class="lesson-head"><div class="eyebrow">REVIEW NOTE</div><h1>헷갈렸던 개념, 한 번 더</h1><p>마지막 답이 틀린 문제 ${wrong.length}개예요. 다시 맞히면 이 목록에서 빠져요.</p></div>`+(wrong.length?wrong.map(x=>`<a class="panel review-card" href="${url(x.i,'quiz',x.j)}"><span class="badge">${esc(x.l.title)}</span><h3 style="margin-top:14px">${esc(x.q.q)}</h3><span class="tiny muted">문제와 해설 다시 보기</span></a>`).join(''):`<div class="panel empty"><h2>지금은 남은 오답이 없어요.</h2><p>아직 풀지 않은 문제도 차근차근 만나 보세요.</p>${button('#home','학습 지도 보기',true)}</div>`);}
  function envlab(){nav(-2);$('#crumb').textContent='환경변수 실험실';$('#main').innerHTML=`<div class="lesson-head"><div class="eyebrow">ENVIRONMENT LAB · 가짜 값으로 실험</div><h1>설정은 어느 단계에서 바뀔까요?</h1><p>DB_HOST 하나를 따라가는 모형이에요. 실제 파일·Docker·DB에는 접근하지 않아요.</p></div><div class="columns"><section><div class="panel lab"><h2>1. 설정 원본을 골라 보세요</h2><div class="lab-controls"><label>서비스 env_file의 DB_HOST<select id="env-file"><option value="managed.example">managed.example</option><option value="postgres">postgres</option><option value="localhost">localhost</option></select></label><label>서비스 environment의 DB_HOST<select id="env-override"><option value="postgres">postgres (고정값)</option><option value="none">설정하지 않음</option><option value="empty">빈 문자열로 설정</option></select></label><label>앱이 읽는 .env.production<select id="env-app"><option value="none">파일 없음</option><option value="legacy.example">DB_HOST=legacy.example</option></select></label><label>NODE_ENV (프로세스 시작 전)<select id="env-mode"><option value="production">production</option><option value="none">없음</option></select></label></div><h2>2. 반영 동작을 선택해요</h2><p class="tiny">시작 상태: 컨테이너 생성 환경의 DB_HOST는 postgres예요. 위에서 선택한 앱 파일은 이미 컨테이너에 존재한다고 가정해요.</p><button id="restart" class="btn">restart 모형 실행</button> <button id="recreate" class="btn primary">recreate 모형 실행</button><div id="lab-result" class="lab-result" role="status" style="margin-top:20px">설정을 바꾸고 동작을 눌러 보세요.</div></div><div class="panel"><h3>이 모형에서 확인하는 세 단계</h3><p>① env_file보다 environment가 우선해요.<br>② restart는 기존 생성 환경을 유지하고 recreate는 새 설정을 주입해요.<br>③ 우리 config/loadEnv.js의 override: true는 주입된 값을 한 번 더 바꿀 수 있어요.</p><p class="tiny muted">모형의 범위: 셸 치환·CLI -e·Dockerfile ENV·다른 앱 설정은 생략했어요. 앱 파일을 이미지에 넣는다면 그 파일 변경에는 이미지 재빌드도 필요해요. 실제 운영 비밀 파일을 이미지에 넣으라는 예제가 아니에요.</p></div>${button(url(5),'환경변수 개념 읽기')} ${button(url(6,'quiz'),'문제 해결 퀴즈',true)}</section><aside><div class="panel"><h3>생각해 볼 질문</h3><p>env_file을 바꿔도 environment가 고정되어 있으면 결과가 달라질까요?</p><p>recreate 후에도 앱의 override 파일이 남아 있다면 어떤 값이 최종값일까요?</p><p>NODE_ENV가 시작 전에 없으면 우리 로더는 .env.production을 선택할까요?</p></div></aside></div>`;let created='postgres',createdMode='production';const run=recreate=>{const file=$('#env-file').value,over=$('#env-override').value,desired=over==='none'?file:over==='empty'?'':over,app=$('#env-app').value,mode=$('#env-mode').value;if(recreate){created=desired;createdMode=mode;}const overridden=createdMode==='production'&&app!=='none',final=overridden?app:created;$('#lab-result').innerHTML=`<strong>앱의 최종 DB_HOST: ${esc(final||'(빈 문자열)')}</strong><p>Compose가 준비한 값: ${esc(desired||'(빈 문자열)')}<br>현재 컨테이너의 생성 환경: ${esc(created||'(빈 문자열)')}</p><p>${recreate?'새 구성으로 컨테이너를 재생성했어요.':'같은 컨테이너를 재시작하여 생성 환경은 유지했어요.'} ${overridden?'앱의 .env.production이 override: true로 다시 덮어썼어요.':'선택되는 앱 override 파일이 없어 주입값을 유지해요.'}</p>`;};$('#restart').onclick=()=>run(false);$('#recreate').onclick=()=>run(true);}
  function render(){const parts=location.hash.slice(1).split('/');menu(false);if(parts[0]==='lesson'&&/^\d+$/.test(parts[1])&&LESSONS[Number(parts[1])])lesson(Number(parts[1]),parts[2],/^\d+$/.test(parts[3])?Number(parts[3]):0);else if(parts[0]==='glossary')glossary();else if(parts[0]==='review')review();else if(parts[0]==='envlab')envlab();else home();window.scrollTo(0,0);$('#main').focus({preventScroll:true});}
  addEventListener('hashchange',render);render();
})();
</script></body></html>
